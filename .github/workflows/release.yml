name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Controlli
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build release
        run: cargo build --release --verbose

      - name: Compila l'installer (Inno Setup)
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe non trovato dopo l'installazione di Inno Setup" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "Setup: $($_.FullName) ($($_.Length) bytes)" }

      - name: Prepara l'archivio portatile
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/tapdeck.exe dist/
          cp res/icon.ico dist/
          cd dist
          7z a -tzip ../tapdeck-windows.zip tapdeck.exe icon.ico

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TapDeck-Setup-*.exe
            tapdeck-windows.zip
          generate_release_notes: true
