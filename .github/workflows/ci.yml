name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formattazione
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release --verbose

      - name: Compila l'installer (Inno Setup)
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe non trovato dopo l'installazione di Inno Setup" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepara l'archivio
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/tapdeck.exe dist/
          cp res/icon.ico dist/
          cd dist
          7z a -tzip ../tapdeck-windows.zip tapdeck.exe icon.ico

      - uses: actions/upload-artifact@v4
        with:
          name: tapdeck-windows
          path: |
            tapdeck-windows.zip
            dist/TapDeck-Setup-*.exe
          if-no-files-found: error
