name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formattazione
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release --verbose

      - name: Prepara l'archivio
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/tapdeck.exe dist/
          cp install.ps1 dist/
          cp res/icon.ico dist/
          cd dist
          7z a -tzip ../tapdeck-windows.zip tapdeck.exe install.ps1 icon.ico

      - uses: actions/upload-artifact@v4
        with:
          name: tapdeck-windows
          path: tapdeck-windows.zip
          if-no-files-found: error
